<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apontamentos Megadoor</title>
<style>
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;background:#f2f4f5;color:#10161a;font-size:14px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:1px solid #ddd;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  main{padding:14px 18px}
  nav button,.btn{border:1px solid #bbb;background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
  nav button.ativo{background:#1b8a5a;color:#fff;border-color:#1b8a5a}
  .btn.primario{background:#1b8a5a;color:#fff;border-color:#1b8a5a}
  .btn:disabled{opacity:.5;cursor:default}
  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
  table{border-collapse:collapse;width:100%;background:#fff}
  th,td{border-bottom:1px solid #e3e6e8;padding:6px 8px;text-align:left;vertical-align:middle}
  th{font-size:11px;text-transform:uppercase;color:#5a656d}
  select,input{font:inherit;padding:4px 6px;border:1px solid #bbb;border-radius:5px;max-width:260px}
  .st{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .pend{background:#fbe3d2;color:#8a3b10}.ok{background:#d8f0e1;color:#0a6b3a}.op{background:#e4ecfb;color:#1d4f91}.res{background:#eee;color:#444}
  .card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin-bottom:12px}
  .muted{color:#6b7780;font-size:12px}
  .barra-p{height:10px;background:#1b8a5a;border-radius:4px;display:inline-block}
  #login{max-width:340px;margin:80px auto;background:#fff;padding:24px;border-radius:12px;border:1px solid #ddd}
  #login input{display:block;width:100%;max-width:none;margin:6px 0 12px;box-sizing:border-box}
  .erro{color:#b3261e;font-size:13px;min-height:18px}
  [hidden]{display:none!important}
</style>
</head>
<body>

<div id="login" hidden>
  <h1>Entrar</h1>
  <p class="muted">Acesso restrito. Use o e-mail e a senha cadastrados.</p>
  <form id="formLogin">
    <label>E-mail</label><input id="email" type="email" required autocomplete="username">
    <label>Senha</label><input id="senha" type="password" required autocomplete="current-password">
    <button class="btn primario" type="submit">Entrar</button>
    <div id="erroLogin" class="erro"></div>
  </form>
</div>

<div id="senha" hidden>
  <div id="login" style="margin:80px auto">
  <h1>Defina sua senha</h1>
  <p class="muted">Escolha uma senha para entrar no sistema.</p>
  <form id="formSenha">
    <label>Nova senha (mínimo 8 caracteres)</label><input id="senhaNova" type="password" minlength="8" required autocomplete="new-password">
    <label>Repita a senha</label><input id="senhaNova2" type="password" minlength="8" required autocomplete="new-password">
    <button class="btn primario" type="submit">Salvar senha</button>
    <div id="erroSenha" class="erro"></div>
  </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div><h1>Apontamentos Megadoor</h1><div class="muted" id="quem"></div></div>
    <div class="barra"><span class="muted" id="modo"></span><button class="btn" id="sair">Sair</button></div>
  </header>
  <main>
    <div class="barra">
      <nav>
        <button id="abaParadas" class="ativo">Paradas</button>
        <button id="abaPareto">Divergências</button>
      </nav>
      <label>De <input type="date" id="ini"></label>
      <label>até <input type="date" id="fim"></label>
      <button class="btn" id="atualizar">Atualizar</button>
      <span class="muted" id="resumo"></span>
    </div>
    <div id="msg" class="erro"></div>
    <section id="secParadas"><div class="card" style="padding:0;overflow:auto"><table id="tabela"></table></div></section>
    <section id="secPareto" hidden><div class="card" id="pareto"></div></section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://bdohqikuaoxlhjwexlqd.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkb2hxaWt1YW94bGhqd2V4bHFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxOTEzMzUsImV4cCI6MjEwODc2NzMzNX0.TNJ7zQwTDi1XddJ6MHQ7qA1WzTHfbR26RpIQqnAnbyM';
  const DONA = 'beatriz.almeida@adooren.com';
  const LIMITE = 170;
  const TIPO_LINK = new URLSearchParams(location.hash.slice(1)).get('type');
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();

  // Texto do operador (coluna OEE) -> subgrupo novo
  const OPER_MAP = {'outros…': 'Outros', 'outros...': 'Outros', 'outros': 'Outros', 'pequena parada': 'Pequena parada',
    'quebra de máquina': 'Quebra de Máquina', 'troca da linha de usinagem': 'Ajuste de ferragem',
    'falha operaciona': 'Outros', 'falha operacional': 'Outros', 'alimentação de peças na megadoor': 'Pequena parada'};
  const NAO_APONTOU = 'turno anterior não preencheu';

  let S = {subgrupos: [], programadas: [], legado: {}, classif: {}, pend: {}, linhas: [], user: null, dona: false};

  function mostrar(qual) {
    $('login').hidden = qual !== 'login';
    $('app').hidden = qual !== 'app';
    $('senha').hidden = qual !== 'senha';
  }

  function operNorm(texto) {
    if (texto == null) return null;
    const t = String(texto).trim();
    if (!t || t === '00:00:00' || t === ' ' || /^1900-/.test(t)) return null;
    return t;
  }

  function subgrupoNovo(s) {
    if (!s) return null;
    if (S.legado[s]) return S.legado[s];
    return s;
  }

  function statusDe(l) {
    const c = S.classif[l.nreg];
    if (c && c.subgrupo) return 'classificada';
    const p = S.pend[l.nreg];
    if (p && p.status === 'ignorada') return 'ignorada';
    const op = operNorm(l.oee_operador);
    if (op && norm(op) === norm(NAO_APONTOU)) return 'resolvida';
    if (op) return 'operador';
    return 'pendente';
  }

  const ROTULO = {classificada:['ok','Classificada'], operador:['op','Só operador'], pendente:['pend','Pendente'],
    resolvida:['res','Turno não apontou'], ignorada:['res','Ignorada']};

  function grupoDe(subgrupo) {
    const r = S.subgrupos.find(x => x.subgrupo === subgrupo);
    return r ? r : {grupo: null, seis_perdas: null};
  }

  async function carregar() {
    $('msg').textContent = '';
    $('resumo').textContent = 'Carregando...';
    const ini = $('ini').value, fim = $('fim').value;
    let q = sb.from('coletor').select('nreg,data_hora,dia,hora,hora_anterior,t_ciclo_s,idturno,menuid,oee_operador,conjunto,problema,solucao,observacao,item')
      .gt('t_ciclo_s', LIMITE).order('data_hora', {ascending: false}).limit(3000);
    if (ini) q = q.gte('dia', ini);
    if (fim) q = q.lte('dia', fim);
    const [col, cls, sub, prog, leg, pen] = await Promise.all([
      q, sb.from('classificacao').select('*'), sb.from('subgrupos').select('*'),
      sb.from('programadas').select('*'), sb.from('legado_mapa').select('*'), sb.from('pendencias').select('*')
    ]);
    const erro = [col, cls, sub, prog, leg, pen].find(r => r.error);
    if (erro) { $('msg').textContent = 'Erro ao carregar: ' + erro.error.message; $('resumo').textContent = ''; return; }
    S.linhas = (col.data || []).filter(l => l.menuid !== 99999 && l.hora_anterior !== '06:00:00');
    S.classif = {}; cls.data.forEach(c => S.classif[c.nreg] = c);
    S.pend = {}; pen.data.forEach(p => S.pend[p.nreg] = p);
    S.subgrupos = sub.data || []; S.programadas = prog.data || [];
    S.legado = {}; leg.data.forEach(x => S.legado[x.antigo] = x.novo);
    renderParadas();
    renderPareto();
  }

  function contagens() {
    const c = {pendente: 0, operador: 0, classificada: 0, resolvida: 0, ignorada: 0};
    S.linhas.forEach(l => c[statusDe(l)]++);
    return c;
  }

  function renderParadas() {
    const c = contagens();
    $('resumo').textContent = `${S.linhas.length} paradas acima de ${LIMITE}s · ${c.pendente} pendentes`;
    const subs = S.subgrupos.map(s => `<option value="${esc(s.subgrupo)}">${esc(s.subgrupo)}</option>`).join('');
    const progs = S.programadas.map(p => `<option value="${esc(p.programada)}">${esc(p.programada)}</option>`).join('');
    let h = `<thead><tr><th>Data/hora</th><th>Turno</th><th>Ciclo (s)</th><th>Operador</th><th>Status</th>
      <th>Programada</th><th>Subgrupo</th><th>Grupo / 6 Grandes Perdas</th><th></th></tr></thead><tbody>`;
    S.linhas.slice(0, 500).forEach(l => {
      const st = statusDe(l), [cl, tx] = ROTULO[st];
      const c0 = S.classif[l.nreg] || {};
      const op = operNorm(l.oee_operador) || '—';
      const turno = {1:'A',2:'B',3:'C'}[l.idturno] || l.idturno;
      const editavel = S.dona ? '' : 'disabled';
      h += `<tr data-n="${l.nreg}">
        <td>${esc(l.data_hora)}</td><td>${esc(turno)}</td><td>${esc(l.t_ciclo_s)}</td>
        <td>${esc(op)}</td><td><span class="st ${cl}">${tx}</span></td>
        <td><select class="prog" ${editavel}><option value="">—</option>${progs}</select></td>
        <td><select class="sub" ${editavel}><option value="">—</option>${subs}</select></td>
        <td class="grp muted">${esc(c0.grupo ? c0.grupo + ' / ' + c0.seis_perdas : '')}</td>
        <td>${S.dona ? `<button class="btn salvar">Salvar</button> ${st === 'pendente' ? '<button class="btn ignorar">Ignorar</button>' : ''}` : ''}</td>
      </tr>`;
    });
    h += '</tbody>';
    $('tabela').innerHTML = h;
    // preenche valores atuais
    $('tabela').querySelectorAll('tr[data-n]').forEach(tr => {
      const n = tr.dataset.n, c0 = S.classif[n];
      if (c0) {
        tr.querySelector('.prog').value = c0.programada || '';
        tr.querySelector('.sub').value = c0.subgrupo || '';
      }
    });
    if (S.dona) {
      $('tabela').querySelectorAll('.sub').forEach(sel => sel.addEventListener('change', () => {
        const g = grupoDe(sel.value);
        sel.closest('tr').querySelector('.grp').textContent = g.grupo ? g.grupo + ' / ' + g.seis_perdas : '';
      }));
      $('tabela').querySelectorAll('.salvar').forEach(b => b.addEventListener('click', () => salvar(b.closest('tr'))));
      $('tabela').querySelectorAll('.ignorar').forEach(b => b.addEventListener('click', () => ignorar(b.closest('tr'))));
    }
  }

  async function salvar(tr) {
    const nreg = Number(tr.dataset.n);
    const programada = tr.querySelector('.prog').value;
    const subgrupo = tr.querySelector('.sub').value;
    const prog = S.programadas.find(p => p.programada === programada);
    if (!programada) { $('msg').textContent = 'Escolha a programada.'; return; }
    if (prog && prog.exige_grupo && !subgrupo) { $('msg').textContent = 'Escolha o subgrupo.'; return; }
    const g = prog && prog.exige_grupo ? grupoDe(subgrupo) : {grupo: null, seis_perdas: null};
    const {error} = await sb.from('classificacao').upsert({
      nreg, programada, subgrupo: subgrupo || null, grupo: g.grupo, seis_perdas: g.seis_perdas,
      atualizado_por: S.user.email, atualizado_em: new Date().toISOString()
    }, {onConflict: 'nreg'});
    if (error) { $('msg').textContent = 'Erro ao salvar: ' + error.message; return; }
    $('msg').textContent = '';
    await carregar();
  }

  async function ignorar(tr) {
    const nreg = Number(tr.dataset.n);
    const {error} = await sb.from('pendencias').upsert({nreg, status: 'ignorada', resolvido_em: new Date().toISOString()}, {onConflict: 'nreg'});
    if (error) { $('msg').textContent = 'Erro: ' + error.message; return; }
    await carregar();
  }

  function renderPareto() {
    const cont = {};
    let total = 0, iguais = 0;
    S.linhas.forEach(l => {
      const c = S.classif[l.nreg];
      const op = operNorm(l.oee_operador);
      if (!c || !c.subgrupo || !op || norm(op) === norm(NAO_APONTOU)) return;
      total++;
      const mine = subgrupoNovo(c.subgrupo);
      const oper = OPER_MAP[norm(op)] || op;
      if (norm(mine) === norm(oper)) { iguais++; return; }
      const k = `${mine}  →  operador: ${oper}`;
      cont[k] = (cont[k] || 0) + 1;
    });
    const lista = Object.entries(cont).sort((a, b) => b[1] - a[1]);
    const acum = lista.reduce((s, x) => s + x[1], 0);
    let acc = 0;
    const max = lista.length ? lista[0][1] : 1;
    let h = `<h3 style="margin:0 0 6px">Divergências entre sua classificação e a do operador</h3>
      <div class="muted">Comparadas ${total} paradas classificadas por você e apontadas pelo operador.
      Coincidem: ${iguais} · Divergem: ${acum}. "Turno anterior não preencheu" não entra na comparação.</div>
      <table style="margin-top:10px"><thead><tr><th>Divergência</th><th>Qtd</th><th>%</th><th>Acumulado</th><th></th></tr></thead><tbody>`;
    lista.forEach(([k, v]) => {
      acc += v;
      h += `<tr><td>${esc(k)}</td><td>${v}</td><td>${(v / acum * 100).toFixed(0)}%</td>
        <td>${(acc / acum * 100).toFixed(0)}%</td><td><span class="barra-p" style="width:${Math.round(v / max * 180)}px"></span></td></tr>`;
    });
    h += '</tbody></table>';
    if (!lista.length) h += '<p class="muted">Ainda não há paradas suficientes classificadas para comparar.</p>';
    $('pareto').innerHTML = h;
  }

  function trocarAba(qual) {
    const paradas = qual === 'paradas';
    $('secParadas').hidden = !paradas; $('secPareto').hidden = paradas;
    $('abaParadas').classList.toggle('ativo', paradas); $('abaPareto').classList.toggle('ativo', !paradas);
  }

  async function entrar(sess) {
    S.user = sess.user;
    S.dona = (sess.user.email || '').toLowerCase() === DONA;
    $('quem').textContent = sess.user.email;
    $('modo').textContent = S.dona ? 'Edição' : 'Somente leitura';
    mostrar('app');
    const hoje = new Date();
    const ini = new Date(hoje); ini.setDate(hoje.getDate() - 14);
    $('ini').value = ini.toISOString().slice(0, 10);
    $('fim').value = hoje.toISOString().slice(0, 10);
    await carregar();
  }

  $('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('erroLogin').textContent = '';
    const {data, error} = await sb.auth.signInWithPassword({email: $('email').value.trim(), password: $('senha').value});
    if (error) { $('erroLogin').textContent = 'E-mail ou senha incorretos.'; return; }
    entrar(data.session);
  });
  $('sair').addEventListener('click', async () => { await sb.auth.signOut(); mostrar('login'); });
  $('atualizar').addEventListener('click', carregar);
  $('abaParadas').addEventListener('click', () => trocarAba('paradas'));
  $('abaPareto').addEventListener('click', () => trocarAba('pareto'));

  $('formSenha').addEventListener('submit', async (e) => {
    e.preventDefault();
    if ($('senhaNova').value !== $('senhaNova2').value) { $('erroSenha').textContent = 'As senhas não conferem.'; return; }
    const {error} = await sb.auth.updateUser({password: $('senhaNova').value});
    if (error) { $('erroSenha').textContent = 'Não foi possível salvar: ' + error.message; return; }
    history.replaceState(null, '', location.pathname);
    const {data} = await sb.auth.getSession();
    if (data.session) entrar(data.session); else mostrar('login');
  });

  sb.auth.getSession().then(({data}) => {
    if (data.session && (TIPO_LINK === 'recovery' || TIPO_LINK === 'invite')) { S.user = data.session.user; mostrar('senha'); return; }
    if (data.session) entrar(data.session); else mostrar('login');
  });
})();
</script>
</body>
</html>
